# Normal public runtime configuration. The launcher copies this file to
# lcs.conf once; later package updates preserve the user's settings.
# map | relocate | jni | render | game
stage=game

# auto unbinds the framebuffer console for graphical stages only.
# auto | on | off
unbind_vt=auto

# Seconds to leave diagnostic results visible before returning to the menu.
console_wait=4

# on makes the game-stage exit require observed graphics, audio, controls,
# persistent save I/O, and a pause/resume probe. Leave off for normal play.
# on | off
proof_mode=off
# Valid range: 1 through 86400 seconds.
proof_seconds=60
